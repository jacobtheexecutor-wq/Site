<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AccountBay Account</title>
  <meta name="description" content="Manage your AccountBay profile, wallet, security settings, and listings." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="demo-bar" id="demoBar" hidden>Demo mode — the server isn't set up yet, so listings are saved in this browser only.</div>

  <header class="top">
    <div class="wrap top-inner">
      <a href="./" class="brand" aria-label="AccountBay home">
        <img src="assets/images/logo.svg" alt="" width="40" height="40" />
        <span>AccountBay</span>
      </a>
      <div class="top-actions">
        <a class="btn ghost" href="./">Home</a>
        <a class="btn sell" href="./listings.html">Listings</a>
        <a class="avatar" id="accountBtn" href="/account.html" aria-label="Open account" role="button"></a>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div id="marketView">
      <section class="panel account-shell" id="accountPageShell">
        <div class="account-header">
          <div>
            <p class="muted">Your account</p>
            <h1>Profile & security</h1>
          </div>
        </div>
        <div id="accountPageContent"></div>
      </section>
    </div>
    <div id="pageView" hidden></div>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <a href="./" class="brand small"><img src="assets/images/logo.svg" alt="" width="26" height="26" /><span>AccountBay</span></a>
      <span class="foot-note">Safe trading, profile editing, and wallet controls from one dashboard.</span>
      <span class="foot-pay" id="footPay" aria-label="Accepted payment methods"></span>
      <a href="/admin.html" class="foot-link">Staff</a>
    </div>
  </footer>

  <dialog id="viewDlg" class="dlg"><div class="dlg-body" id="viewBody"></div></dialog>

  <dialog id="joinDlg" class="dlg">
    <form class="dlg-body" id="joinForm" method="dialog" novalidate>
      <div class="dlg-head"><h2 id="joinTitle">Create your account</h2><button class="x" value="cancel" formnovalidate aria-label="Close">×</button></div>
      <div class="seg" role="tablist" aria-label="Sign in or create account">
        <button type="button" role="tab" data-join-mode="signup" class="on" value="mode">Create account</button>
        <button type="button" role="tab" data-join-mode="signin" value="mode">Sign in</button>
      </div>
      <div class="join-signup">
        <label>Username<input name="name" minlength="3" maxlength="24" placeholder="e.g. kai_trades" autocomplete="username" /></label>
        <label>Email<input name="email" type="email" maxlength="120" placeholder="you@example.com" autocomplete="email" /></label>
        <label>Password <span class="opt">(at least 8 characters)</span><input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" /></label>
        <label>Contact (only shown to people you trade with)<input name="contact" minlength="3" maxlength="80" placeholder="Discord, email, etc." /></label>
      </div>
      <div class="join-signin" hidden>
        <label>Email or username<input name="login" maxlength="120" autocomplete="username" /></label>
        <label>Password<input name="loginPassword" type="password" maxlength="128" autocomplete="current-password" /></label>
      </div>
      <p class="form-ok" id="joinOk" role="status" hidden></p>
      <p class="form-err" id="joinErr" role="alert"></p>
      <button class="btn sell wide" type="submit" value="default" id="joinBtn">Create account</button>
    </form>
  </dialog>

  <dialog id="postDlg" class="dlg">
    <form class="dlg-body" id="postForm" method="dialog" novalidate>
      <div class="dlg-head"><h2>New listing</h2><button class="x" value="cancel" formnovalidate aria-label="Close">×</button></div>
      <div class="two">
        <label>Game<select name="game" id="postGame" required></select></label>
        <label>Category<select name="category" id="postCat"></select></label>
      </div>
      <div class="other-game" id="otherGame" hidden>
        <label>Game name<input name="gameOther" maxlength="30" placeholder="Which game?" /></label>
      </div>
      <label>Title<input name="title" required minlength="3" maxlength="70" placeholder="e.g. Dragon Permanent" /></label>
      <div class="two">
        <label>Price (USD)<input name="price" type="number" required min="0.01" max="10000" step="0.01" placeholder="0.00" /></label>
        <label><span>Original price <span class="opt">(optional)</span></span><input name="wasPrice" type="number" min="0.01" max="100000" step="0.01" placeholder="Shows a discount" /></label>
      </div>
      <div class="instant">
        <label class="check-row"><input type="checkbox" id="instantOn" /><span><b>⚡ Instant delivery</b><span class="muted">Add the account login now.</span></span></label>
        <div class="login-rows" id="loginRows" hidden></div>
        <button type="button" class="btn ghost sm" id="addLogin" hidden>+ Add another account</button>
      </div>
      <label id="stockLabel">In stock<input name="stock" type="number" min="1" max="999" step="1" value="1" /></label>
      <label>Description<textarea name="description" required minlength="10" maxlength="1000" rows="4" placeholder="What's included, how you deliver it, any warranty."></textarea></label>
      <p class="form-err" id="postErr" role="alert"></p>
      <button class="btn sell wide" type="submit" value="default">Publish listing</button>
    </form>
  </dialog>

  <div class="drawer-back" id="drawerBack" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Profile" aria-hidden="true" tabindex="-1"><div id="drawerBody"></div></aside>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/js/games.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay-icons.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/account.js"></script>
</body>
</html>
