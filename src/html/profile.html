<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AccountBay Profile</title>
  <meta name="description" content="Manage your AccountBay profile, security settings, and public profile" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="demo-bar" id="demoBar" hidden>Demo mode — the server isn't set up yet, so listings are saved in this browser only.</div>

  <header class="top">
    <div class="wrap top-inner">
      <a href="./" class="brand" aria-label="AccountBay home">
        <img src="assets/images/logo.svg" alt="" width="40" height="40" />
        <span>AccountBay</span>
      </a>
      <div class="top-actions">
        <a class="btn ghost" href="./">Home</a>
        <a class="btn sell" href="./listings.html">Listings</a>
        <a class="avatar" id="accountBtn" href="/account.html" aria-label="Open account" role="button"></a>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div id="marketView">
      <section class="panel account-shell" id="accountPageShell">
        <div class="account-header">
          <div>
            <p class="muted">Your profile</p>
            <h1>Public profile & account settings</h1>
          </div>
        </div>
        <div id="accountPageContent"></div>
      </section>
    </div>
    <div id="pageView" hidden></div>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <a href="./" class="brand small"><img src="assets/images/logo.svg" alt="" width="26" height="26" /><span>AccountBay</span></a>
      <span class="foot-note">Safe trading, profile editing, and wallet controls from one dashboard.</span>
      <span class="foot-pay" id="footPay" aria-label="Accepted payment methods"></span>
      <a href="/admin.html" class="foot-link">Staff</a>
    </div>
  </footer>

  <div class="drawer-back" id="drawerBack" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Profile" aria-hidden="true" tabindex="-1"><div id="drawerBody"></div></aside>
  <div class="toast" id="toast" role="status"></div>

  <script src="assets/js/games.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/pay-icons.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/account.js"></script>
</body>
</html>
